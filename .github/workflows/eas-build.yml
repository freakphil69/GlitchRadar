name: Upload verified GlitchRadar Android bundle to internal Play draft

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Exact UUID of the successful Android AAB from the approved build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: glitchradar-google-play-internal-draft
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Verify destination and exact bundle, then submit
        env:
          BUILD_ID: ${{ inputs.build_id }}
          EXPECTED_SOURCE_SHA: '4524185abbde446d632a9b22666761f7854f36ef'
        run: |
          set -euo pipefail
          [[ "$BUILD_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
          node -e 'const c=require("./eas.json"), a=require("./app.json");const t=c.submit.production.android;if(t.track!=="internal"||t.releaseStatus!=="draft"||a.expo.android.package!=="glitchradar.app")throw new Error("Unexpected Play destination")'
          eas build:view "$BUILD_ID" --json > "$RUNNER_TEMP/glitchradar-build.json"
          node -e 'const b=require(process.argv[1]);const link=b.artifacts?.buildUrl||b.artifacts?.applicationArchiveUrl||"";if(b.id!==process.env.BUILD_ID||b.status!=="FINISHED"||b.platform!=="ANDROID"||b.gitCommitHash!==process.env.EXPECTED_SOURCE_SHA||!new URL(link).pathname.endsWith(".aab"))throw new Error("Not the verified Android AAB"); console.log(`Verified AAB ${b.id}, version code ${b.appBuildVersion??"unknown"}`)' "$RUNNER_TEMP/glitchradar-build.json"
          eas submit --id "$BUILD_ID" --platform android --profile production --non-interactive --wait
