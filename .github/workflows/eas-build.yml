name: EAS Android Build
on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        default: preview
        type: choice
        options: [production, preview]
  push:
    branches: [main]
    paths:
      - '.github/workflows/eas-build.yml'
      - 'frontend/app.json'
      - 'frontend/src/components/AppSplash.tsx'
      - 'frontend/assets/**'
      - 'frontend/scripts/render_logo.py'
permissions:
  contents: read
concurrency:
  group: eas-android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Check EXPO_TOKEN secret
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo 'EXPO_TOKEN secret is missing; no EAS build was started.'
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate existing mascot branding
        run: |
          python -m pip install 'Pillow==11.3.0'
          python scripts/render_logo.py
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Use npm for the checked source and remote build archive
        run: |
          npm install --global npm@11.19.1
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.packageManager='npm@11.19.1';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');"
          npm ci --no-audit --no-fund
      - name: Regression, offer policy, type and lint checks
        run: |
          npm run test:beta
          node --test scripts/test-offer-policy.cjs
          npx --no-install tsc --noEmit
          CI=1 npm run lint
      - name: Validate Android JavaScript bundle
        run: CI=1 npx --no-install expo export --platform android --output-dir /tmp/glitchradar-before-eas
      - name: Build on Expo and wait for native result
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PROFILE: ${{ inputs.profile || 'preview' }}
        run: |
          eas whoami
          eas build --platform android --profile "$PROFILE" --non-interactive --wait --json > eas-build.json
          node -e "const fs=require('fs');const raw=JSON.parse(fs.readFileSync('eas-build.json','utf8'));const builds=Array.isArray(raw)?raw:[raw];if(!builds.length||builds.some(b=>b.status!=='FINISHED'))throw new Error('Native EAS build is not FINISHED');for(const b of builds){console.log(JSON.stringify({id:b.id,status:b.status,platform:b.platform,buildUrl:b.artifacts?.buildUrl,applicationArchiveUrl:b.artifacts?.applicationArchiveUrl}));fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'EAS Android '+b.status+' — build '+b.id+'\n'+(b.artifacts?.buildUrl||b.artifacts?.applicationArchiveUrl||'')+'\n');}"
      - name: Save EAS build reference
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-eas-build-reference
          path: frontend/eas-build.json
          if-no-files-found: warn
